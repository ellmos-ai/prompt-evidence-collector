[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-evidence-collector"
dynamic = ["version"]
description = "Standalone, cloud-safe prompt/workflow evidence collector (local-only raw store, hashed receipts)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Lukas Geiger" }]
keywords = ["evidence", "local-first", "prompt", "receipts", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = ["cryptography>=43"]

[project.urls]
Documentation = "https://github.com/ellmos-ai/prompt-evidence-collector#readme"
Issues = "https://github.com/ellmos-ai/prompt-evidence-collector/issues"
Repository = "https://github.com/ellmos-ai/prompt-evidence-collector"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
prompt-evidence-collector = "prompt_evidence_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "prompt_evidence_collector._version.__version__"}

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
